# Silent sink VRCT listens to (as "VRChat Voices [Loopback]"). vrct-voice-filter
# feeds it VRChat-only audio, so music from other apps is never transcribed.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "vrchat_voices"
      node.description = "VRChat Voices"
      media.class      = Audio/Sink
      audio.position   = [ MONO ]
      audio.rate       = 16000
      node.virtual     = true
      priority.session = 0
      priority.driver  = 0
    }
  }
]
